name: Manufacturing QMS catalog

on:
  pull_request:
    paths:
      - 'db/mysql/126_manufacturing_quality_management_eqms_catalog.sql'
      - 'scripts/manufacturing_qms_catalog_check.php'
      - '.github/workflows/manufacturing-qms-catalog.yml'
  push:
    branches: [main]
    paths:
      - 'db/mysql/126_manufacturing_quality_management_eqms_catalog.sql'
      - 'scripts/manufacturing_qms_catalog_check.php'
      - '.github/workflows/manufacturing-qms-catalog.yml'

jobs:
  catalog-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: php -l scripts/manufacturing_qms_catalog_check.php
      - name: Evidence-first manufacturing QMS contract
        run: php scripts/manufacturing_qms_catalog_check.php
