name: Stabilization audit

on:
  pull_request:
    paths:
      - 'api/**'
      - 'app/lib/**'
      - 'db/mysql/**'
      - 'scripts/security_control_audit.php'
      - 'scripts/migration_integrity_check.php'
      - 'scripts/community_intelligence_auto_publish.php'
      - 'scripts/community_auto_publish_check.php'
      - 'scripts/comparison_seo_priority_report.php'
      - 'scripts/comparison_seo_check.php'
      - 'sitemap.php'
      - 'crawlable_public_page.php'
      - 'software_logo_page.php'
      - 'community_intelligence_admin.php'
      - 'community_intelligence_admin.js'
      - 'project_decision_matrix.php'
      - '.github/workflows/stabilization-audit.yml'
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'app/lib/**'
      - 'db/mysql/**'
      - 'scripts/security_control_audit.php'
      - 'scripts/migration_integrity_check.php'
      - 'scripts/community_intelligence_auto_publish.php'
      - 'scripts/community_auto_publish_check.php'
      - 'scripts/comparison_seo_priority_report.php'
      - 'scripts/comparison_seo_check.php'
      - 'sitemap.php'
      - 'crawlable_public_page.php'
      - 'software_logo_page.php'
      - 'community_intelligence_admin.php'
      - 'community_intelligence_admin.js'
      - 'project_decision_matrix.php'
      - '.github/workflows/stabilization-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax checks
        run: |
          php -l app/lib/Mailer.php
          php -l app/lib/CommunityIntelligenceAutoPublisher.php
          php -l app/lib/PublicReviewAdminService.php
          php -l app/lib/ComparisonSeoPriority.php
          php -l api/auth.php
          php -l api/community_intelligence_admin.php
          php -l software_logo_page.php
          php -l community_intelligence_admin.php
          php -l crawlable_public_page.php
          php -l sitemap.php
          php -l scripts/community_intelligence_auto_publish.php
          php -l scripts/community_auto_publish_check.php
          php -l scripts/comparison_seo_priority_report.php
          php -l scripts/comparison_seo_check.php
          php -l project_decision_matrix.php
          php -l scripts/security_control_audit.php
          php -l scripts/migration_integrity_check.php
      - name: API mutation security controls
        run: php scripts/security_control_audit.php
      - name: Migration integrity
        run: php scripts/migration_integrity_check.php
      - name: Community Intelligence publication contract
        run: php scripts/community_auto_publish_check.php
      - name: Comparison SEO contract
        run: php scripts/comparison_seo_check.php
