name: Catalog inventory smoke

on:
  pull_request:
    paths:
      - 'app/lib/CatalogInventory.php'
      - 'tools/catalog_inventory.php'
      - '.github/workflows/catalog-inventory-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'app/lib/CatalogInventory.php'
      - 'tools/catalog_inventory.php'
      - '.github/workflows/catalog-inventory-smoke.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax check
        run: |
          php -l app/lib/CatalogInventory.php
          php -l tools/catalog_inventory.php
