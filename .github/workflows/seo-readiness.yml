name: SEO readiness

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo-readiness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: php -l scripts/seo_readiness_contract.php
      - name: Public SEO readiness contract
        run: php scripts/seo_readiness_contract.php
