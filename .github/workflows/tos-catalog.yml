name: Terminal Operating Systems catalog

on:
  pull_request:
    paths:
      - 'db/mysql/117_terminal_operating_system_catalog.sql'
      - 'db/mysql/139_tos_depth_taxonomy_foundation.sql'
      - 'db/mysql/140_tos_kaleris_n4_depth_evidence.sql'
      - 'db/mysql/141_tos_market_names_zodiac_master_terminal.sql'
      - 'db/mysql/142_tos_cyberlogitec_opus_depth_evidence.sql'
      - 'db/mysql/143_tos_rbs_tops_expert_depth_evidence.sql'
      - 'scripts/tos_catalog_check.php'
      - 'scripts/tos_depth_program_check.php'
      - 'scripts/tos_kaleris_n4_depth_check.php'
      - 'scripts/tos_market_name_coverage_check.php'
      - 'scripts/tos_cyberlogitec_opus_depth_check.php'
      - 'scripts/tos_rbs_tops_expert_depth_check.php'
      - 'api/index.php'
      - 'software_page.php'
      - 'frontend/src/softwareCatalogSearch.js'
      - 'docs/TOS_DEPTH_PROGRAM.md'
      - '.github/workflows/tos-catalog.yml'
  push:
    branches: [main]
    paths:
      - 'db/mysql/117_terminal_operating_system_catalog.sql'
      - 'db/mysql/139_tos_depth_taxonomy_foundation.sql'
      - 'db/mysql/140_tos_kaleris_n4_depth_evidence.sql'
      - 'db/mysql/141_tos_market_names_zodiac_master_terminal.sql'
      - 'db/mysql/142_tos_cyberlogitec_opus_depth_evidence.sql'
      - 'db/mysql/143_tos_rbs_tops_expert_depth_evidence.sql'
      - 'scripts/tos_catalog_check.php'
      - 'scripts/tos_depth_program_check.php'
      - 'scripts/tos_kaleris_n4_depth_check.php'
      - 'scripts/tos_market_name_coverage_check.php'
      - 'scripts/tos_cyberlogitec_opus_depth_check.php'
      - 'scripts/tos_rbs_tops_expert_depth_check.php'
      - 'api/index.php'
      - 'software_page.php'
      - 'frontend/src/softwareCatalogSearch.js'
      - 'docs/TOS_DEPTH_PROGRAM.md'
      - '.github/workflows/tos-catalog.yml'

jobs:
  catalog-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l scripts/tos_catalog_check.php
          php -l scripts/tos_depth_program_check.php
          php -l scripts/tos_kaleris_n4_depth_check.php
          php -l scripts/tos_market_name_coverage_check.php
          php -l scripts/tos_cyberlogitec_opus_depth_check.php
          php -l scripts/tos_rbs_tops_expert_depth_check.php
          php -l api/index.php
          php -l software_page.php
      - name: Evidence-first TOS contract
        run: php scripts/tos_catalog_check.php
      - name: TOS depth taxonomy contract
        run: php scripts/tos_depth_program_check.php
      - name: Kaleris N4 depth evidence contract
        run: php scripts/tos_kaleris_n4_depth_check.php
      - name: TOS market-name coverage contract
        run: php scripts/tos_market_name_coverage_check.php
      - name: CyberLogitec OPUS Terminal depth evidence contract
        run: php scripts/tos_cyberlogitec_opus_depth_check.php
      - name: RBS TOPS Expert depth evidence contract
        run: php scripts/tos_rbs_tops_expert_depth_check.php
