name: Frontend dependency lock

on:
  push:
    branches:
      - fix/263-pin-frontend-dependencies
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Generate deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Clean install
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Commit generated lockfile when changed
        working-directory: .
        run: |
          if git diff --quiet -- frontend/package-lock.json && git ls-files --error-unmatch frontend/package-lock.json >/dev/null 2>&1; then
            echo "Lockfile already committed and unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "#263 Commit deterministic frontend lockfile"
          git push
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: frontend-package-lock
          path: frontend/package-lock.json
          if-no-files-found: error
