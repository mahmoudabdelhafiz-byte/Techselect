name: Frontend dependency validation

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-lock.yml'
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-lock.yml'
  workflow_dispatch:

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Clean install from committed lockfile
        run: npm ci --ignore-scripts
      - name: Consultation UI regression contract
        run: npm run check:consultation-ui
      - name: Build
        run: npm run build
