name: Software catalog search

on:
  pull_request:
    paths:
      - 'frontend/src/softwareCatalogSearch.js'
      - 'api/index.php'
      - 'software_page.php'
      - 'db/mysql/141_tos_market_names_zodiac_master_terminal.sql'
      - 'frontend/src/main.jsx'
      - 'scripts/software_catalog_search_check.php'
      - '.github/workflows/software-catalog-search.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/src/softwareCatalogSearch.js'
      - 'api/index.php'
      - 'software_page.php'
      - 'db/mysql/141_tos_market_names_zodiac_master_terminal.sql'
      - 'frontend/src/main.jsx'
      - 'scripts/software_catalog_search_check.php'
      - '.github/workflows/software-catalog-search.yml'

jobs:
  search-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l scripts/software_catalog_search_check.php
          php -l api/index.php
          php -l software_page.php
      - name: Software catalog search contract
        run: php scripts/software_catalog_search_check.php
