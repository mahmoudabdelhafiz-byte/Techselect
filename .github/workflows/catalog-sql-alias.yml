name: Catalog SQL alias integrity

on:
  pull_request:
    paths:
      - 'db/mysql/105_*.sql'
      - 'db/mysql/106_*.sql'
      - 'db/mysql/107_*.sql'
      - 'db/mysql/108_*.sql'
      - 'db/mysql/109_*.sql'
      - 'db/mysql/110_*.sql'
      - 'db/mysql/111_*.sql'
      - 'db/mysql/112_*.sql'
      - 'db/mysql/113_*.sql'
      - 'db/mysql/114_*.sql'
      - 'db/mysql/115_*.sql'
      - 'db/mysql/117_*.sql'
      - 'db/mysql/118_*.sql'
      - 'db/mysql/119_*.sql'
      - 'db/mysql/120_*.sql'
      - 'db/mysql/121_*.sql'
      - 'db/mysql/122_*.sql'
      - 'db/mysql/123_*.sql'
      - 'db/mysql/124_*.sql'
      - 'db/mysql/125_*.sql'
      - 'db/mysql/126_*.sql'
      - 'db/mysql/127_*.sql'
      - 'db/mysql/128_*.sql'
      - 'db/mysql/129_*.sql'
      - 'db/mysql/130_*.sql'
      - 'scripts/catalog_sql_alias_check.php'
      - '.github/workflows/catalog-sql-alias.yml'
  push:
    branches: [main]
    paths:
      - 'db/mysql/105_*.sql'
      - 'db/mysql/106_*.sql'
      - 'db/mysql/107_*.sql'
      - 'db/mysql/108_*.sql'
      - 'db/mysql/109_*.sql'
      - 'db/mysql/110_*.sql'
      - 'db/mysql/111_*.sql'
      - 'db/mysql/112_*.sql'
      - 'db/mysql/113_*.sql'
      - 'db/mysql/114_*.sql'
      - 'db/mysql/115_*.sql'
      - 'db/mysql/117_*.sql'
      - 'db/mysql/118_*.sql'
      - 'db/mysql/119_*.sql'
      - 'db/mysql/120_*.sql'
      - 'db/mysql/121_*.sql'
      - 'db/mysql/122_*.sql'
      - 'db/mysql/123_*.sql'
      - 'db/mysql/124_*.sql'
      - 'db/mysql/125_*.sql'
      - 'db/mysql/126_*.sql'
      - 'db/mysql/127_*.sql'
      - 'db/mysql/128_*.sql'
      - 'db/mysql/129_*.sql'
      - 'db/mysql/130_*.sql'
      - 'scripts/catalog_sql_alias_check.php'
      - '.github/workflows/catalog-sql-alias.yml'

jobs:
  alias-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: php -l scripts/catalog_sql_alias_check.php
      - name: Validate derived capability aliases
        run: php scripts/catalog_sql_alias_check.php
