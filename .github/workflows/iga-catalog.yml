name: Identity Governance Administration catalog

on:
  pull_request:
    paths:
      - 'db/mysql/115_identity_governance_administration_catalog.sql'
      - 'scripts/iga_catalog_check.php'
      - '.github/workflows/iga-catalog.yml'
  push:
    branches: [main]
    paths:
      - 'db/mysql/115_identity_governance_administration_catalog.sql'
      - 'scripts/iga_catalog_check.php'
      - '.github/workflows/iga-catalog.yml'

jobs:
  catalog-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: php -l scripts/iga_catalog_check.php
      - name: Evidence-first IGA contract
        run: php scripts/iga_catalog_check.php
